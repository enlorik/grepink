name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Prepare local fonts for layout preview
        run: |
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/inter/Inter%5Bopsz,wght%5D.ttf' -o "$RUNNER_TEMP/Inter.ttf"
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/google/fonts/47d54ca1ebb14fd864695f1d39dc734f39017c33/ofl/robotomono/RobotoMono%5Bwght%5D.ttf' -o "$RUNNER_TEMP/RobotoMono.ttf"

      - name: Run tests
        run: flutter test
        env:
          GREPINK_LAYOUT_PREVIEW: build/review-workspace.png
          GREPINK_PREVIEW_FONT: ${{ runner.temp }}/Inter.ttf
          GREPINK_PREVIEW_MONO: ${{ runner.temp }}/RobotoMono.ttf

      - name: Save rendered review layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grepink-review-layout
          path: build/review-workspace.png
          if-no-files-found: warn
          retention-days: 14

  compile-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Save Android test app
        uses: actions/upload-artifact@v4
        with:
          name: grepink-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  compile-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

  compile-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Test desktop database persistence on Windows
        run: flutter test test/services/desktop_database_path_test.dart

      - name: Save Windows test app
        uses: actions/upload-artifact@v4
        with:
          name: grepink-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grepink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: TypeScript type check
        working-directory: server
        run: npm run typecheck

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grepink_test
          SYNC_TOKEN: ci-test-token-not-a-secret
        run: npm test

      - name: Build server
        working-directory: server
        run: npm run build

  publish-release:
    name: Publish Windows and Android downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze-and-test, compile-android, compile-ios, compile-windows, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested Windows app
        uses: actions/download-artifact@v4
        with:
          name: grepink-windows-x64
          path: downloads/windows

      - name: Download tested Android app
        uses: actions/download-artifact@v4
        with:
          name: grepink-android-debug
          path: downloads/android

      - name: Package and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_RUN_NUMBER}"
          # Published previews are immutable; rerunning CI must not replace them.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          test -f downloads/windows/grepink.exe
          test -f downloads/windows/flutter_windows.dll
          test -f downloads/windows/sqlite3.dll
          test -f downloads/windows/data/app.so
          test -f downloads/android/app-debug.apk
          mkdir -p release
          (cd downloads/windows && zip -q -r ../../release/Grepink-Windows-x64.zip .)
          cp downloads/android/app-debug.apk release/Grepink-Android-debug.apk
          (cd release && sha256sum Grepink-Windows-x64.zip Grepink-Android-debug.apk > SHA256SUMS.txt)
          cat > release/NOTES.md <<EOF
          Automatically published after all Flutter tests, server tests, and Android, iOS, and Windows builds passed.

          **Windows:** download **Grepink-Windows-x64.zip**, extract the entire ZIP into a folder, and open **grepink.exe**.

          **Android:** download **Grepink-Android-debug.apk** to your phone and install it; this is a debug preview, not a signed production release.

          iPhone installation still requires a signed iOS build; source-code archives are not installable apps.

          Source commit: ${GITHUB_SHA}
          EOF
          gh release create "$tag" \
            release/Grepink-Windows-x64.zip \
            release/Grepink-Android-debug.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Grepink preview ${GITHUB_RUN_NUMBER} — Windows and Android" \
            --notes-file release/NOTES.md \
            --prerelease
